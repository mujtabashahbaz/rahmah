<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What It Said on the Golden Ticket — Quiz</title>
<style>
:root{color-scheme:dark;--bg:#090b10;--panel:#121722;--panel2:#192131;--line:#293448;--text:#edf2fa;--muted:#9ba8bb;--gold:#e8bd55;--green:#39c98a;--red:#f07178;--blue:#7aaeff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#1b2639 0%,var(--bg) 55%);color:var(--text);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;min-height:100vh}
.wrap{width:min(900px,calc(100% - 28px));margin:38px auto 70px}.hero{text-align:center;margin-bottom:24px}.eyebrow{color:var(--gold);text-transform:uppercase;letter-spacing:.16em;font-size:.72rem;font-weight:800}.hero h1{font-family:Georgia,serif;font-size:clamp(1.8rem,5vw,2.8rem);line-height:1.15;margin:10px 0}.hero p{color:var(--muted);margin:0}
.summary{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;background:var(--panel);border:1px solid var(--line);padding:16px 18px;border-radius:16px;margin-bottom:18px}.progress-top{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:.88rem;margin-bottom:9px}.track{height:8px;border-radius:99px;background:#273144;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#c99b36,var(--gold));transition:width .2s}.score{text-align:right;min-width:90px}.score strong{display:block;font-size:1.55rem;color:var(--gold);line-height:1.1}.score span{font-size:.75rem;color:var(--muted)}
.controls{display:flex;flex-wrap:wrap;gap:9px;margin:0 0 18px}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:9px 14px;border-radius:10px;font-weight:650;cursor:pointer}.btn:hover{border-color:var(--gold)}.btn.primary{background:var(--gold);border-color:var(--gold);color:#17130a}.btn:disabled{opacity:.4;cursor:not-allowed}
.question{background:linear-gradient(145deg,#151c29,#10151f);border:1px solid var(--line);border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 10px 28px #0002}.qhead{display:flex;gap:12px;align-items:flex-start}.num{flex:0 0 34px;height:34px;border-radius:10px;background:#302817;color:var(--gold);display:grid;place-items:center;font-weight:800}.qtitle{font-weight:700;font-size:1.04rem;margin:3px 0 15px}.options{display:grid;gap:9px}.option{display:flex;align-items:flex-start;gap:11px;padding:11px 13px;border:1px solid #303b4e;border-radius:11px;background:#0e1420;cursor:pointer;transition:.15s}.option:hover{border-color:#71839e;background:#151e2d}.option input{accent-color:var(--gold);margin:4px 0 0;flex:0 0 auto}.letter{color:var(--gold);font-weight:800;min-width:20px}.option.selected{border-color:var(--blue);background:#17243a}.option.correct{border-color:var(--green);background:#10251f}.option.wrong{border-color:var(--red);background:#2a171c}.feedback{display:none;margin-top:13px;padding:12px 14px;border-radius:10px;background:#1b2635;color:#dce6f4;font-size:.92rem}.feedback.show{display:block}.feedback.good{border-left:3px solid var(--green)}.feedback.bad{border-left:3px solid var(--red)}
.footer{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:22px}.hint{font-size:.82rem;color:var(--muted)}.result{display:none;text-align:center;background:var(--panel);border:1px solid var(--line);padding:24px;border-radius:16px;margin-top:18px}.result.show{display:block}.result strong{font-size:2.2rem;color:var(--gold)}
@media(max-width:600px){.wrap{margin-top:24px}.summary{grid-template-columns:1fr}.score{text-align:left}.question{padding:15px}.option{padding:10px}.footer .btn{flex:1}}
</style>
</head>
<body>
<main class="wrap">
<header class="hero"><div class="eyebrow">Reading comprehension</div><h1>What It Said on the Golden Ticket</h1><p>Charlie and the Chocolate Factory · 20 multiple-choice questions</p></header>
<section class="summary" aria-label="Quiz progress"><div><div class="progress-top"><span id="progressText">0 of 20 answered</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="progressFill"></div></div></div><div class="score"><strong id="score">0 / 20</strong><span>Correct answers</span></div></section>
<div class="controls"><button class="btn" id="checkBtn">Check all answers</button><button class="btn" id="resetBtn">Reset quiz</button></div>
<section id="quiz"></section>
<div class="footer"><span class="hint">Keyboard: A–D select · N next question · P previous question</span><div><button class="btn" id="prevBtn">← Previous</button> <button class="btn primary" id="nextBtn">Next →</button></div></div>
<section class="result" id="result"><div class="eyebrow">Your result</div><strong id="finalScore">0 / 20</strong><p id="resultMessage"></p><button class="btn" id="reviewBtn">Review answers</button></section>
</main>
<script>
const questions = [
{q:"How did Charlie announce his discovery to his family?",o:["He quietly showed his mother the ticket.","He burst through the front door shouting.","He sent Grandpa Joe a message.","He asked his father to come outside."],a:1,e:"Charlie rushed into the grandparents' room, shouting excitedly that he had found the last Golden Ticket."},
{q:"Where did Charlie find the money to buy the chocolate bars?",o:["In his father's coat.","In the family savings box.","In the street.","At the chocolate shop."],a:2,e:"Charlie found some money in the street and used it to buy two chocolate bars."},
{q:"How many chocolate bars did Charlie buy?",o:["One","Two","Three","Four"],a:1,e:"He bought two bars of chocolate, and the second one contained the Golden Ticket."},
{q:"How did Grandpa Joe initially react to Charlie's announcement?",o:["He immediately started dancing.","He accused Charlie of stealing.","He thought Charlie was joking.","He fainted with excitement."],a:2,e:"Grandpa Joe initially wondered whether Charlie was pulling their legs."},
{q:"What happened to Grandpa Joe's bowl of soup when he jumped out of bed?",o:["It fell onto the floor.","It landed on Charlie.","It flew into Grandma Josephine's face.","It spilled onto his bed."],a:2,e:"His bowl of soup went flying into Grandma Josephine's face."},
{q:"How old was Grandpa Joe?",o:["Ninety years old","Ninety-five years old","Ninety-six and a half","One hundred years old"],a:2,e:"The passage describes him as ninety-six and a half."},
{q:"Why was Mr Bucket cold and tired when he arrived home?",o:["He had been walking all day.","He had been shovelling snow in the streets.","He had been working inside a factory.","He had been looking for Charlie."],a:1,e:"Mr Bucket had spent the entire day shovelling snow in the streets."},
{q:"What was the Golden Ticket apparently made from?",o:["Gold-painted paper","A sheet of pure gold","Golden foil","A thin sheet of copper"],a:1,e:"It appeared to be made from pure gold hammered almost to the thinness of paper."},
{q:"Who was the author of the invitation printed on the Golden Ticket?",o:["Mr Bucket","Grandpa Joe","Mr Willy Wonka","The shopkeeper"],a:2,e:"The invitation was from Mr Willy Wonka."},
{q:"What would happen if the Golden Ticket holder ran out of food supplies?",o:["They would receive money.","They could return to the factory and have their cupboard refilled.","They would receive another Golden Ticket.","They would be sent a monthly food allowance."],a:1,e:"Wonka promised to refill the cupboard with whatever the ticket holder wanted."},
{q:"On which date was the factory visit scheduled?",o:["31 January","1 February","2 February","10 February"],a:1,e:"The visit was scheduled for the first day of February."},
{q:"At what time were the Golden Ticket holders expected at the factory gates?",o:["Eight o'clock","Nine o'clock","Ten o'clock","Eleven o'clock"],a:2,e:"They had to arrive at ten o'clock sharp in the morning."},
{q:"How many family members could Charlie bring with him?",o:["Exactly one","Exactly two","Either one or two","His entire family"],a:2,e:"Wonka allowed each ticket holder to bring either one or two family members."},
{q:"Who volunteered to accompany Charlie to the factory?",o:["Mr Bucket","Mrs Bucket","Grandpa Joe","Grandma Josephine"],a:2,e:"Grandpa Joe enthusiastically volunteered to accompany Charlie."},
{q:"Why did Mrs Bucket decide she could not accompany Charlie?",o:["She was feeling unwell.","She had to work.","She could not leave the other three elderly grandparents alone.","She was afraid of the factory."],a:2,e:"She did not want to leave the other three old people alone in bed for the entire day."},
{q:"Why did Mr Bucket think Grandpa Joe deserved to accompany Charlie?",o:["He was the oldest family member.","He knew more about the factory visit than the others.","He had bought Charlie the chocolate.","He had already visited the factory."],a:1,e:"Mr Bucket felt Grandpa Joe deserved to go because he seemed to know more about it than the others."},
{q:"Who arrived at the Bucket family's house after the announcement?",o:["Police officers and doctors","Newspapermen and photographers","Factory workers","Schoolteachers and neighbours"],a:1,e:"Swarms of newspapermen and photographers arrived to report the discovery."},
{q:"Why did the newspapermen and photographers visit the Bucket family?",o:["To interview Mr Wonka.","To investigate the chocolate shop.","To get the story of the fifth Golden Ticket for the newspapers.","To photograph the grandparents."],a:2,e:"They wanted the full story for the front pages of the morning papers."},
{q:"What time was it approximately when Mr Bucket finally managed to get rid of the visitors?",o:["Eight in the evening","Ten in the evening","Nearly midnight","Early the next morning"],a:2,e:"The visitors caused pandemonium for several hours, and it was nearly midnight before they left."},
{q:"Which statement best describes Grandpa Joe's reaction to Charlie's discovery?",o:["He remained calm and practical.","He was initially sceptical but soon became overwhelmingly excited.","He was disappointed that Mr Bucket could not go.","He was worried about the cost of the journey."],a:1,e:"He initially suspected a joke, but once he saw the ticket, he erupted with excitement and danced around the room."}
];
let answers = JSON.parse(localStorage.getItem('goldenTicketAnswers') || '{}');
let checked = false, current = 0;
const quiz = document.getElementById('quiz');
function render(){quiz.innerHTML='';questions.forEach((q,i)=>{const card=document.createElement('article');card.className='question';card.id='q'+i;card.innerHTML=`<div class="qhead"><div class="num">${i+1}</div><div style="flex:1"><div class="qtitle">${q.q}</div><div class="options">${q.o.map((v,j)=>`<label class="option" data-q="${i}" data-a="${j}"><input type="radio" name="q${i}" value="${j}" ${answers[i]===j?'checked':''} ${checked?'disabled':''}><span class="letter">${'ABCD'[j]}.</span><span>${v}</span></label>`).join('')}</div><div class="feedback" id="f${i}"></div></div></div>`;quiz.appendChild(card);});
quiz.querySelectorAll('input[type=radio]').forEach(el=>el.addEventListener('change',e=>{if(checked)return;const i=+e.target.name.slice(1);answers[i]=+e.target.value;localStorage.setItem('goldenTicketAnswers',JSON.stringify(answers));update();}));
if(checked) showFeedback();update();}
function update(){const count=Object.keys(answers).length;const score=questions.reduce((s,q,i)=>s+(answers[i]===q.a?1:0),0);document.getElementById('progressText').textContent=`${count} of ${questions.length} answered`;document.getElementById('percent').textContent=Math.round(count/questions.length*100)+'%';document.getElementById('progressFill').style.width=(count/questions.length*100)+'%';document.getElementById('score').textContent=`${score} / ${questions.length}`;document.getElementById('prevBtn').disabled=current===0;document.getElementById('nextBtn').disabled=current===questions.length-1;}
function showFeedback(){questions.forEach((q,i)=>{const labels=quiz.querySelectorAll(`[data-q="${i}"]`);labels.forEach((l,j)=>{l.classList.remove('correct','wrong');if(j===q.a)l.classList.add('correct');if(answers[i]===j&&j!==q.a)l.classList.add('wrong');});const f=document.getElementById('f'+i);f.className='feedback show '+(answers[i]===q.a?'good':'bad');f.innerHTML=`<strong>${answers[i]===q.a?'Correct!':'Not quite.'}</strong> ${q.e} <br><strong>Answer: ${'ABCD'[q.a]}. ${q.o[q.a]}</strong>`;});}
function check(){if(Object.keys(answers).length!==questions.length){const missing=questions.findIndex((q,i)=>answers[i]===undefined);document.getElementById('q'+missing).scrollIntoView({behavior:'smooth',block:'center'});alert('Please answer all 20 questions before checking your result.');return;}checked=true;render();const score=questions.reduce((s,q,i)=>s+(answers[i]===q.a?1:0),0);document.getElementById('finalScore').textContent=`${score} / ${questions.length}`;document.getElementById('resultMessage').textContent=score>=18?'Excellent work!':score>=15?'Very good!':score>=10?'Good effort — keep practising!':'Keep practising. You can try again!';document.getElementById('result').classList.add('show');document.getElementById('checkBtn').disabled=true;document.getElementById('result').scrollIntoView({behavior:'smooth'});}
function reset(){if(!confirm('Reset all your answers and start again?'))return;answers={};checked=false;current=0;localStorage.removeItem('goldenTicketAnswers');document.getElementById('result').classList.remove('show');document.getElementById('checkBtn').disabled=false;render();window.scrollTo({top:0,behavior:'smooth'});}
function go(n){current=Math.max(0,Math.min(questions.length-1,n));document.getElementById('q'+current).scrollIntoView({behavior:'smooth',block:'center'});update();}
document.getElementById('checkBtn').addEventListener('click',check);document.getElementById('resetBtn').addEventListener('click',reset);document.getElementById('prevBtn').addEventListener('click',()=>go(current-1));document.getElementById('nextBtn').addEventListener('click',()=>go(current+1));document.getElementById('reviewBtn').addEventListener('click',()=>{document.getElementById('q0').scrollIntoView({behavior:'smooth'});});
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;const k=e.key.toLowerCase();if('abcd'.includes(k)&&!checked){const el=document.querySelector(`#q${current} input[value="${'abcd'.indexOf(k)}"]`);if(el){el.checked=true;el.dispatchEvent(new Event('change',{bubbles:true}));}}if(k==='n')go(current+1);if(k==='p')go(current-1);});
render();
</script>
</body></html>
