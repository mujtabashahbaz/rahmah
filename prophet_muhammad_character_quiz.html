<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Character of Prophet Muhammad ﷺ — Quiz</title>
<style>
:root{
  color-scheme:dark;--bg:#090d12;--panel:#121a24;--panel2:#182331;
  --text:#edf2f7;--muted:#9aa9b8;--line:#293747;--accent:#67d6b2;
  --good:#1e9b70;--bad:#d45e68;--blue:#79aef5;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#172638 0%,var(--bg) 55%);
  color:var(--text);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;padding:28px 16px}
main{max-width:820px;margin:0 auto}
header{text-align:center;margin:12px 0 26px}
.kicker{color:var(--accent);font-size:.78rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
h1{font-size:clamp(1.7rem,5vw,2.5rem);line-height:1.2;margin:10px 0}
.subtitle{color:var(--muted);margin:0}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px;flex:1;min-width:130px}
.stat small{display:block;color:var(--muted);font-size:.78rem}
.stat strong{font-size:1.15rem}
.progress-wrap{height:8px;background:#263443;border-radius:20px;overflow:hidden;margin:0 0 22px}
#progress{height:100%;width:0;background:var(--accent);transition:width .25s}
.card{background:rgba(18,26,36,.96);border:1px solid var(--line);border-radius:20px;padding:clamp(18px,4vw,30px);box-shadow:0 18px 50px #0005}
.qtop{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:.85rem;margin-bottom:12px}
h2{font-size:clamp(1.2rem,3.5vw,1.55rem);line-height:1.35;margin:0 0 20px}
.options{display:grid;gap:10px}
.option{width:100%;text-align:left;display:flex;align-items:flex-start;gap:12px;padding:14px 15px;
  border:1px solid var(--line);border-radius:13px;background:var(--panel2);color:var(--text);
  font:inherit;cursor:pointer;transition:.15s}
.option:hover:not(:disabled){border-color:var(--blue);transform:translateY(-1px)}
.option:disabled{cursor:default;opacity:1}
.letter{display:grid;place-items:center;flex:0 0 28px;height:28px;border-radius:8px;background:#26384b;color:#c9d9e8;font-weight:800;font-size:.85rem}
.option.correct{border-color:var(--good);background:#12372f}
.option.correct .letter{background:var(--good);color:white}
.option.wrong{border-color:var(--bad);background:#3a2028}
.option.wrong .letter{background:var(--bad);color:white}
#feedback{display:none;margin-top:16px;padding:14px 16px;border-radius:12px;background:#1b2b38;border:1px solid var(--line)}
#feedback.show{display:block}
#feedback.good{border-color:var(--good)}
#feedback.bad{border-color:var(--bad)}
#feedback strong{display:block;margin-bottom:4px}
.controls{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
button.action{border:0;border-radius:11px;padding:12px 18px;font:inherit;font-weight:750;cursor:pointer}
#next{background:var(--accent);color:#092018;margin-left:auto}
#next:disabled{opacity:.35;cursor:not-allowed}
#restart{background:#26384b;color:var(--text)}
#result{display:none;text-align:center;padding:22px 8px}
#result h2{font-size:1.8rem;margin-bottom:8px}
#result p{color:var(--muted)}
.result-score{font-size:3rem;font-weight:850;color:var(--accent);margin:12px}
footer{text-align:center;color:var(--muted);font-size:.8rem;margin:18px 0 4px}
@media(max-width:520px){body{padding:18px 12px}.controls{flex-wrap:wrap}.controls button{flex:1}}
</style>
</head>
<body>
<main>
<header>
  <div class="kicker">Islamiat • Knowledge Check</div>
  <h1>The Character of Prophet Muhammad ﷺ</h1>
  <p class="subtitle">Choose the best answer for each question.</p>
</header>

<section class="stats" aria-label="Quiz progress">
  <div class="stat"><small>Question</small><strong id="counter">1 / 10</strong></div>
  <div class="stat"><small>Score</small><strong id="score">0</strong></div>
  <div class="stat"><small>Answered</small><strong id="answered">0 / 10</strong></div>
</section>
<div class="progress-wrap"><div id="progress"></div></div>

<section class="card" id="quiz">
  <div class="qtop"><span id="topic">Good character</span><span id="number">QUESTION 01</span></div>
  <h2 id="question"></h2>
  <div class="options" id="options"></div>
  <div id="feedback" role="status" aria-live="polite"></div>
  <div class="controls">
    <button class="action" id="restart" type="button">Start over</button>
    <button class="action" id="next" type="button" disabled>Next question →</button>
  </div>
</section>

<section class="card" id="result">
  <div class="kicker">Quiz complete</div>
  <h2>Well done!</h2>
  <div class="result-score" id="finalScore">0 / 10</div>
  <p id="message"></p>
  <button class="action" id="again" type="button" style="background:var(--accent);color:#092018">Try again</button>
</section>

<footer>Take your time, read each question carefully, and learn from the explanations.</footer>
</main>
<script>
const questions = [
 {topic:"Truthfulness",q:"Which quality was Prophet Muhammad ﷺ especially known for even before he received prophethood?",
  a:["Truthfulness and trustworthiness","Wealth and power","Loudness and pride","Being strict with everyone"],c:0,
  e:"People in Makkah knew him as Al‑Amin (the trustworthy) and As‑Sadiq (the truthful)."},
 {topic:"Trustworthiness",q:"What does being trustworthy mean?",
  a:["Keeping promises and taking care of what is entrusted to you","Taking what belongs to others","Making promises you do not intend to keep","Hiding the truth when it is difficult"],c:0,
  e:"A trustworthy person fulfils promises and carefully protects anything placed in their care."},
 {topic:"Kindness",q:"How should we treat people, following the example of Prophet Muhammad ﷺ?",
  a:["With kindness, respect and fairness","Only kindly when they are rich","Rudely if they disagree with us","Without caring about their feelings"],c:0,
  e:"His example teaches kindness, respect and fair treatment of others."},
 {topic:"Mercy",q:"Which word best describes the way Prophet Muhammad ﷺ treated children?",
  a:["Gentleness","Cruelty","Impatience","Unkindness"],c:0,
  e:"He showed affection and gentleness towards children and treated them with care."},
 {topic:"Forgiveness",q:"When someone wrongs us, which response best follows the Prophet's example of forgiveness?",
  a:["Forgive when possible and avoid taking revenge","Always seek revenge","Make fun of the person","Treat everyone else badly too"],c:0,
  e:"Forgiveness and mercy are important parts of his noble character."},
 {topic:"Humility",q:"What does humility mean?",
  a:["Being modest and not thinking you are better than others","Bragging about yourself","Demanding special treatment","Looking down on people"],c:0,
  e:"A humble person is modest and does not consider themselves superior to others."},
 {topic:"Neighbours",q:"How should a Muslim behave towards neighbours?",
  a:["Be helpful, considerate and kind","Ignore them whenever they need help","Disturb them on purpose","Speak unkindly to them"],c:0,
  e:"The Prophet taught Muslims to respect and care for their neighbours."},
 {topic:"Patience",q:"What is patience?",
  a:["Staying calm and doing what is right during difficulty","Getting angry immediately","Giving up whenever something is hard","Blaming others for every problem"],c:0,
  e:"Patience means remaining steady, doing what is right and seeking Allah's help during difficulty."},
 {topic:"Care for animals",q:"How should animals be treated according to the Prophet's teachings?",
  a:["With kindness and care","Cruelly, because they cannot speak","Neglected without food or water","Used for amusement by hurting them"],c:0,
  e:"The Prophet taught compassion towards animals and warned against causing them suffering."},
 {topic:"Everyday character",q:"Which action is a good way to follow the character of Prophet Muhammad ﷺ in everyday life?",
  a:["Speaking honestly and helping others","Mocking someone who makes a mistake","Breaking a promise","Being unkind to people who are different"],c:0,
  e:"Honesty, helpfulness and kindness are practical ways to follow his example."}
];
let index=0, score=0, answered=0, locked=false;
const $=id=>document.getElementById(id);
function render(){
 locked=false;
 const item=questions[index];
 $("counter").textContent=`${index+1} / ${questions.length}`;
 $("number").textContent=`QUESTION ${String(index+1).padStart(2,"0")}`;
 $("topic").textContent=item.topic;
 $("question").textContent=item.q;
 $("score").textContent=score;
 $("answered").textContent=`${answered} / ${questions.length}`;
 $("progress").style.width=`${answered/questions.length*100}%`;
 $("options").innerHTML="";
 $("feedback").className=""; $("feedback").innerHTML="";
 item.a.forEach((answer,i)=>{
  const b=document.createElement("button"); b.type="button"; b.className="option";
  const letter=document.createElement("span"); letter.className="letter"; letter.textContent=String.fromCharCode(65+i);
  const label=document.createElement("span"); label.textContent=answer;
  b.append(letter,label); b.addEventListener("click",()=>choose(i)); $("options").append(b);
 });
 $("next").disabled=true;
 $("next").textContent=index===questions.length-1?"See results →":"Next question →";
}
function choose(choice){
 if(locked)return; locked=true; answered++;
 const item=questions[index], buttons=[...$("options").children], correct=choice===item.c;
 if(correct)score++;
 buttons.forEach((b,i)=>{b.disabled=true;if(i===item.c)b.classList.add("correct");else if(i===choice)b.classList.add("wrong")});
 $("feedback").className=`show ${correct?"good":"bad"}`;
 $("feedback").innerHTML=`<strong>${correct?"That’s right!":"Not quite."}</strong>${item.e}`;
 $("score").textContent=score; $("answered").textContent=`${answered} / ${questions.length}`;
 $("progress").style.width=`${answered/questions.length*100}%`; $("next").disabled=false;
}
function next(){
 if(!locked)return;
 if(index<questions.length-1){index++;render();}else{
  $("quiz").style.display="none";$("result").style.display="block";
  $("finalScore").textContent=`${score} / ${questions.length}`;
  $("message").textContent=score===questions.length?"Excellent work! You answered every question correctly.":score>=7?"Great effort! Review the explanations and try once more.":"Good effort. Read the explanations, then try again to improve your score.";
 }
}
function restart(){index=0;score=0;answered=0;$("result").style.display="none";$("quiz").style.display="block";render();}
$("next").addEventListener("click",next);$("restart").addEventListener("click",restart);$("again").addEventListener("click",restart);
render();
</script>
</body>
</html>
